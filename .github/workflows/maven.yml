name: Java CI

on:
  push:
  pull_request:
  schedule: [ cron: '29 16 * * 5' ] # weekly: At 02:29 on Friday

jobs:
  build:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 25
          cache: 'maven'

      - run: mvn --batch-mode --show-version --no-transfer-progress -DCI=GitHub verify
