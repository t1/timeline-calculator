name: Java CI

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: 21.0.12+101.0.LTS
          distribution: 'temurin'
          cache: 'maven'
      - run: mvn --batch-mode --show-version --no-transfer-progress -DCI=GitHub verify
